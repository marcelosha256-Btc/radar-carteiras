name: Coleta (a cada 2 h)

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/coleta_hora.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
