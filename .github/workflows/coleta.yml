name: Coleta (de hora em hora)

on:
  schedule:
    # o GitHub atrasa e pula agendamentos; de hora em hora sobram coletas mesmo assim.
    # quem chega menos de 50 min depois de uma coleta só registra e sai
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # avisos por e-mail: o radar abre uma issue mencionando o dono

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/coleta_hora.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
