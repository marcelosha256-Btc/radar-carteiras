name: Alertas (laço contínuo)

# Confere preços e posições a cada minuto por ~5h30 e dispara a próxima execução (coletor/alertas.py).
# O agendamento é só rede de segurança. Precisa dos segredos TELEGRAM_TOKEN e TELEGRAM_CHAT_ID.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

concurrency:
  group: radar-alertas
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/alertas.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
