name: Teste de aviso por e-mail

# Roda uma vez quando este arquivo é enviado; depois pode ser apagado.
on:
  push:
    paths: [".github/workflows/teste-aviso.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -c "import sys; sys.path.insert(0, 'coletor'); from avisos import avisar; assert avisar('Teste de aviso do Radar de Carteiras', 'Se este e-mail chegou, os avisos de sinal de swing e de coleta parada vão chegar do mesmo jeito. Pode fechar esta issue.', rotulo='teste')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
