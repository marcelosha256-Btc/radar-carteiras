name: Ranking diário (reserva)

on:
  schedule:
    - cron: "23 6 * * *"    # 03:23 em Brasília
    - cron: "23 14 * * *"   # 11:23: reserva, só trabalha se o das 03:23 foi pulado
  workflow_dispatch:

concurrency:
  group: radar-ranking
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # avisos por e-mail: o radar abre uma issue mencionando o dono

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/ranking_diario.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
